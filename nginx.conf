server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

  location / {
    try_files $uri /index.html;
  }

  # Resolve the backend at request time, not at startup: a literal hostname
  # in proxy_pass is resolved when the config loads, which kills the whole
  # container when the API is not running yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $sandbox_svc sandbox-svc;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$sandbox_svc:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
